name: medical-chatbot

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - disabled
    networks:
      - default 

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - disabled
    networks:
      - default

  chat-backend:
    build:
      context: ../chat-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
      JWT_SECRET: ${JWT_SECRET}
      CHAT_API_URL: ${CHAT_API_URL}
    depends_on:
      # - postgres
      - chat-api
    networks:
      - default

  chat-api:
    build:
      context: ../chat-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # LLM sinh văn bản: Server A (vLLM). Thiếu URL/key thì chat-api báo lỗi, không fallback OpenAI.
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-27b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-65536}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-16}
      LLM_STRUCTURED_OUTPUT_METHOD: ${LLM_STRUCTURED_OUTPUT_METHOD:-json_schema}
      # Embedding vẫn dùng OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      # Retrieval deep mode: số văn bản mỗi chuyên khoa và số chunk mỗi văn bản
      RETRIEVAL_DEEP_DOCUMENT_LIMIT: ${RETRIEVAL_DEEP_DOCUMENT_LIMIT:-4}
      RETRIEVAL_DEEP_TOP_K: ${RETRIEVAL_DEEP_TOP_K:-6}
      DEEP_MAX_SPECIALTIES: ${DEEP_MAX_SPECIALTIES:-3}
      # Độ dài tối đa (số từ) của báo cáo trung gian: expert, tổng hợp bệnh, tổng hợp chuyên khoa
      INTERMEDIATE_REPORT_MAX_WORDS: ${INTERMEDIATE_REPORT_MAX_WORDS:-300}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    # depends_on:
    #   - postgres
    networks:
      - default

  chat-frontend:
    build:
      context: ../chat-frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://chat-backend:3000}
        VITE_DOCUMENT_FILE_URL_TEMPLATE: ${VITE_DOCUMENT_FILE_URL_TEMPLATE} # example: https://your-domain/api/v1/documents/{documentId}/file
        VITE_MAINTENANCE_MESSAGE: ${VITE_MAINTENANCE_MESSAGE}
    restart: unless-stopped
    depends_on:
      - chat-backend
    ports:
      - "${FRONTEND_PORT:-8400}:80"
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

    